# Render blueprint for Directus. See DEPLOY.md for the full procedure.
#
# Secrets are marked `sync: false`: Render prompts for them in the dashboard and
# they never enter git. KEY and SECRET must match the values already in use —
# changing SECRET invalidates every session and the read-only build token.

services:
  - type: web
    name: apex-directus
    runtime: image
    image:
      # Pinned deliberately. `latest` would upgrade Directus under you and run
      # irreversible migrations on a redeploy.
      url: docker.io/directus/directus:12.3.1
    plan: starter          # the free plan sleeps; a sleeping CMS fails the build
    region: ohio           # same region as the Supabase project (us-east-2)
    healthCheckPath: /server/ping   # /server/health answers 403 unauthenticated
    envVars:
      # --- database: Supabase session pooler (5432, NOT the 6543 transaction pooler)
      - key: DB_CLIENT
        value: pg
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USER
        sync: false        # postgres.<project-ref>, not plain postgres
      - key: DB_PASSWORD
        sync: false
      # Supabase's pooler presents a self-signed chain, so verification needs
      # their CA pinned. Both of these go together: setting REJECT_UNAUTHORIZED
      # true WITHOUT the CA breaks the connection, and setting it false ships
      # the database password over a connection open to an active
      # man-in-the-middle. Get the PEM from Supabase -> Settings -> Database ->
      # SSL Configuration -> Download certificate, and paste its contents.
      - key: DB_SSL__REJECT_UNAUTHORIZED
        value: "true"
      - key: DB_SSL__CA
        sync: false
      - key: DB_SEARCH_PATH
        value: directus,public

      # --- security: must match the existing instance
      - key: KEY
        sync: false
      - key: SECRET
        sync: false

      # --- public URL and CORS
      - key: PUBLIC_URL
        sync: false        # https://apex-directus.onrender.com
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "8055"
      - key: CORS_ENABLED
        value: "true"
      - key: CORS_ORIGIN
        value: https://www.apextradeshow.com

      # --- storage: S3 (Supabase Storage). Local disk does not survive a redeploy.
      - key: STORAGE_LOCATIONS
        value: s3
      - key: STORAGE_S3_DRIVER
        value: s3
      - key: STORAGE_S3_KEY
        sync: false
      - key: STORAGE_S3_SECRET
        sync: false
      - key: STORAGE_S3_BUCKET
        value: directus
      - key: STORAGE_S3_REGION
        value: us-east-2
      - key: STORAGE_S3_ENDPOINT
        sync: false        # https://<project-ref>.supabase.co/storage/v1/s3
      - key: STORAGE_S3_FORCE_PATH_STYLE
        value: "true"

      - key: FILES_MAX_UPLOAD_SIZE
        value: 25mb
      - key: RATE_LIMITER_ENABLED
        value: "true"
      - key: RATE_LIMITER_POINTS
        value: "50"
      - key: RATE_LIMITER_DURATION
        value: "1"
      - key: TELEMETRY
        value: "false"
