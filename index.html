<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16233b" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- NOTE: brand name is a placeholder — see src/config/brand.js.
         prerender.mjs rewrites title/description/canonical/og per route. -->
    <title>Apex Trade Show — Trade Show Displays, Canopies, Banners & Backdrops</title>
    <meta name="description" content="Complete trade show displays & event branding from one supplier: custom canopy tents, retractable banner stands, step & repeat backdrops and table covers. Instant canopy pricing, free artwork proof, shipped across the US & Canada." />
    <meta name="keywords" content="trade show displays, custom canopy tent, retractable banner stand, x-stand banner, step and repeat backdrop, table cover, event branding, trade show booth, pop up canopy, banner stand" />
    <link rel="canonical" href="https://www.apextradeshow.com/" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Apex Trade Show" />
    <meta property="og:title" content="Apex Trade Show — Complete Trade Show Displays & Event Branding" />
    <meta property="og:description" content="Everything for a professional trade show booth from one supplier — canopy tents, banner stands, backdrops, table covers and accessories. Free artwork proof on every order." />
    <meta property="og:url" content="https://www.apextradeshow.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Apex Trade Show — Complete Trade Show Displays" />
    <meta name="twitter:description" content="Canopy tents, banner stands, backdrops, table covers and event branding — one supplier, free artwork proof." />

    <!-- Site-wide structured data. Single organization node typed OnlineStore
         (online-only — no physical storefront, so not `Store`/LocalBusiness).
         OnlineStore is a subtype of Organization, so it also carries the brand
         org signals + logo — no separate, duplicate Organization node. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "OnlineStore",
      "name": "Apex Trade Show",
      "description": "Complete trade show displays and event branding from one supplier — custom canopy tents, retractable banner stands, step & repeat backdrops, table covers and accessories, with instant canopy pricing and a free artwork proof.",
      "url": "https://www.apextradeshow.com/",
      "logo": "https://www.apextradeshow.com/images/logo.webp",
      "image": "https://www.apextradeshow.com/images/logo.webp",
      "email": "info@apextradeshow.com",
      "telephone": "+1-672-514-7587",
      "priceRange": "$$",
      "areaServed": [
        { "@type": "Country", "name": "United States" },
        { "@type": "Country", "name": "Canada" }
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Apex Trade Show",
      "url": "https://www.apextradeshow.com/"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
