<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-label="3-sided open-back versus 4-sided closed-back table cover comparison">
  <rect width="1120" height="640" fill="#ffffff"/>
  <text x="560" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0b1f4d">3-Sided vs 4-Sided Table Covers</text>
  <text x="560" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#6b7480">Which coverage do you need?</text>
  <line x1="560" y1="110" x2="560" y2="560" stroke="#e4e9f2" stroke-width="2"/>

  <!-- ===== LEFT: 3-SIDED OPEN BACK ===== -->
  <!-- draped cover front elevation, x 190..410 (w220), y 175..430 -->
  <path d="M190,175 H410 V410 Q410,430 390,430 H210 Q190,430 190,410 Z" fill="#eef2f8" stroke="#c9d3e2" stroke-width="1.5"/>
  <rect x="190" y="175" width="220" height="60" fill="#0b1f4d"/>
  <rect x="190" y="175" width="220" height="7" fill="#ED1C24"/>
  <text x="300" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="2">APEX</text>
  <rect x="228" y="300" width="144" height="12" rx="6" fill="#c9d3e2"/>
  <rect x="228" y="330" width="104" height="12" rx="6" fill="#dbe2ee"/>
  <line x1="150" y1="430" x2="450" y2="430" stroke="#c9d3e2" stroke-width="3"/>
  <!-- rear inset: OPEN back (legs visible) -->
  <circle cx="392" cy="150" r="46" fill="#ffffff" stroke="#2f9e44" stroke-width="3"/>
  <rect x="372" y="126" width="7" height="42" rx="2" fill="#8a94a3"/>
  <rect x="405" y="126" width="7" height="42" rx="2" fill="#8a94a3"/>
  <line x1="366" y1="128" x2="418" y2="128" stroke="#8a94a3" stroke-width="4"/>
  <text x="392" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#2f9e44">OPEN REAR</text>
  <text x="300" y="486" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#0b1f4d">3-SIDED — OPEN BACK</text>
  <text x="300" y="514" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#6b7480">Front + left + right covered; rear open</text>
  <text x="300" y="536" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#6b7480">Best for sitting behind or under-table storage</text>

  <!-- ===== RIGHT: 4-SIDED CLOSED BACK ===== -->
  <path d="M710,175 H930 V410 Q930,430 910,430 H730 Q710,430 710,410 Z" fill="#eef2f8" stroke="#c9d3e2" stroke-width="1.5"/>
  <rect x="710" y="175" width="220" height="60" fill="#0b1f4d"/>
  <rect x="710" y="175" width="220" height="7" fill="#ED1C24"/>
  <text x="820" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="2">APEX</text>
  <rect x="748" y="300" width="144" height="12" rx="6" fill="#c9d3e2"/>
  <rect x="748" y="330" width="104" height="12" rx="6" fill="#dbe2ee"/>
  <line x1="670" y1="430" x2="970" y2="430" stroke="#c9d3e2" stroke-width="3"/>
  <!-- rear inset: CLOSED back (solid fabric) -->
  <circle cx="912" cy="150" r="46" fill="#eef2f8" stroke="#0b1f4d" stroke-width="3"/>
  <rect x="888" y="128" width="48" height="44" rx="4" fill="#c9d3e2"/>
  <text x="912" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#0b1f4d">CLOSED REAR</text>
  <text x="820" y="486" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#0b1f4d">4-SIDED — CLOSED BACK</text>
  <text x="820" y="514" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#6b7480">All four sides covered — full 360&#176; coverage</text>
  <text x="820" y="536" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#6b7480">Best when the back of the table is visible</text>
</svg>
