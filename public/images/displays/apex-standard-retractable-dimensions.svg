<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-label="Apex standard retractable banner stand dimension diagram: 33 by 81 inches and 47 by 81 inches printed graphic">
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0b1f4d"/>
    </marker>
  </defs>
  <rect width="1120" height="720" fill="#ffffff"/>
  <text x="560" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0b1f4d">Standard Retractable Banner — Graphic Sizes</text>
  <text x="560" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#6b7480">Two graphic sizes on the same compact aluminium retractable base</text>

  <!-- ============ LEFT: 33 x 81 ============ -->
  <!-- banner: x 226.5..413.5 (width 187 ≈ 33in), y 150..610 (height 460 ≈ 81in) -->
  <rect x="226.5" y="150" width="187" height="460" rx="3" fill="#eef2f8" stroke="#c9d3e2" stroke-width="1.5"/>
  <rect x="226.5" y="150" width="187" height="70" rx="3" fill="#0b1f4d"/>
  <rect x="226.5" y="150" width="187" height="8" fill="#ED1C24"/>
  <text x="320" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="2">APEX</text>
  <rect x="256" y="300" width="128" height="12" rx="6" fill="#c9d3e2"/>
  <rect x="256" y="330" width="96" height="12" rx="6" fill="#dbe2ee"/>
  <rect x="256" y="470" width="128" height="34" rx="6" fill="#ED1C24"/>
  <!-- base cassette + feet -->
  <rect x="214" y="610" width="212" height="30" rx="8" fill="#b9c2cf"/>
  <rect x="214" y="636" width="212" height="10" rx="5" fill="#8a94a3"/>
  <rect x="236" y="646" width="18" height="12" rx="3" fill="#8a94a3"/>
  <rect x="386" y="646" width="18" height="12" rx="3" fill="#8a94a3"/>
  <!-- width arrow (above) -->
  <line x1="226.5" y1="128" x2="413.5" y2="128" stroke="#0b1f4d" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="226.5" y1="120" x2="226.5" y2="150" stroke="#0b1f4d" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="413.5" y1="120" x2="413.5" y2="150" stroke="#0b1f4d" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="320" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0b1f4d">33&#8243;</text>
  <!-- height arrow (left) -->
  <line x1="196" y1="150" x2="196" y2="610" stroke="#0b1f4d" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="188" y1="150" x2="226.5" y2="150" stroke="#0b1f4d" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="188" y1="610" x2="226.5" y2="610" stroke="#0b1f4d" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="180" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0b1f4d" transform="rotate(-90 180 380)">81&#8243;</text>
  <text x="320" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0b1f4d">33&#8243; &#215; 81&#8243; graphic</text>

  <!-- ============ RIGHT: 47 x 81 ============ -->
  <!-- banner: x 666.5..933.5 (width 267 ≈ 47in), y 150..610 -->
  <rect x="666.5" y="150" width="267" height="460" rx="3" fill="#eef2f8" stroke="#c9d3e2" stroke-width="1.5"/>
  <rect x="666.5" y="150" width="267" height="70" rx="3" fill="#0b1f4d"/>
  <rect x="666.5" y="150" width="267" height="8" fill="#ED1C24"/>
  <text x="800" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="2">APEX</text>
  <rect x="700" y="300" width="200" height="12" rx="6" fill="#c9d3e2"/>
  <rect x="700" y="330" width="150" height="12" rx="6" fill="#dbe2ee"/>
  <rect x="700" y="470" width="200" height="34" rx="6" fill="#ED1C24"/>
  <!-- base cassette + feet -->
  <rect x="654" y="610" width="292" height="30" rx="8" fill="#b9c2cf"/>
  <rect x="654" y="636" width="292" height="10" rx="5" fill="#8a94a3"/>
  <rect x="676" y="646" width="18" height="12" rx="3" fill="#8a94a3"/>
  <rect x="906" y="646" width="18" height="12" rx="3" fill="#8a94a3"/>
  <!-- width arrow (above) -->
  <line x1="666.5" y1="128" x2="933.5" y2="128" stroke="#0b1f4d" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="666.5" y1="120" x2="666.5" y2="150" stroke="#0b1f4d" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="933.5" y1="120" x2="933.5" y2="150" stroke="#0b1f4d" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="800" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0b1f4d">47&#8243;</text>
  <!-- height arrow (left) -->
  <line x1="636" y1="150" x2="636" y2="610" stroke="#0b1f4d" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line x1="628" y1="150" x2="666.5" y2="150" stroke="#0b1f4d" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="628" y1="610" x2="666.5" y2="610" stroke="#0b1f4d" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="620" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0b1f4d" transform="rotate(-90 620 380)">81&#8243;</text>
  <text x="800" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0b1f4d">47&#8243; &#215; 81&#8243; graphic</text>
</svg>
