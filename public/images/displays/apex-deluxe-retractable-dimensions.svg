<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 720" role="img" aria-label="Apex deluxe retractable banner stand dimension diagram: 33 by 81 inch printed graphic on a premium chrome-style base">
  <defs>
    <marker id="ahd" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0b1f4d"/>
    </marker>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9edf2"/>
      <stop offset="0.5" stop-color="#c2cad6"/>
      <stop offset="1" stop-color="#9aa3b2"/>
    </linearGradient>
  </defs>
  <rect width="760" height="720" fill="#ffffff"/>
  <text x="380" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0b1f4d">Deluxe Retractable Banner — Graphic Size</text>
  <text x="380" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#6b7480">33&#8243; &#215; 81&#8243; printed graphic on a premium chrome-style base</text>

  <!-- banner: x 286.5..473.5 (width 187 ≈ 33in), y 150..610 (height 460 ≈ 81in) -->
  <rect x="286.5" y="150" width="187" height="460" rx="3" fill="#eef2f8" stroke="#c9d3e2" stroke-width="1.5"/>
  <rect x="286.5" y="150" width="187" height="70" rx="3" fill="#0b1f4d"/>
  <rect x="286.5" y="150" width="187" height="8" fill="#ED1C24"/>
  <text x="380" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="2">APEX</text>
  <rect x="316" y="300" width="128" height="12" rx="6" fill="#c9d3e2"/>
  <rect x="316" y="330" width="96" height="12" rx="6" fill="#dbe2ee"/>
  <rect x="316" y="470" width="128" height="34" rx="6" fill="#ED1C24"/>

  <!-- premium chrome base cassette with chrome-style end caps + feet -->
  <rect x="272" y="610" width="216" height="30" rx="10" fill="url(#chrome)" stroke="#8a94a3" stroke-width="1"/>
  <ellipse cx="280" cy="625" rx="10" ry="16" fill="url(#chrome)" stroke="#8a94a3" stroke-width="1"/>
  <ellipse cx="480" cy="625" rx="10" ry="16" fill="url(#chrome)" stroke="#8a94a3" stroke-width="1"/>
  <rect x="296" y="640" width="18" height="12" rx="3" fill="#8a94a3"/>
  <rect x="446" y="640" width="18" height="12" rx="3" fill="#8a94a3"/>

  <!-- width arrow (above) -->
  <line x1="286.5" y1="128" x2="473.5" y2="128" stroke="#0b1f4d" stroke-width="2" marker-start="url(#ahd)" marker-end="url(#ahd)"/>
  <line x1="286.5" y1="120" x2="286.5" y2="150" stroke="#0b1f4d" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="473.5" y1="120" x2="473.5" y2="150" stroke="#0b1f4d" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="380" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0b1f4d">33&#8243;</text>

  <!-- height arrow (left) -->
  <line x1="256" y1="150" x2="256" y2="610" stroke="#0b1f4d" stroke-width="2" marker-start="url(#ahd)" marker-end="url(#ahd)"/>
  <line x1="248" y1="150" x2="286.5" y2="150" stroke="#0b1f4d" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="248" y1="610" x2="286.5" y2="610" stroke="#0b1f4d" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="240" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0b1f4d" transform="rotate(-90 240 380)">81&#8243;</text>

  <text x="380" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0b1f4d">33&#8243; &#215; 81&#8243; graphic &#183; ~83&#8243; overall height</text>
</svg>
